name: Generate Skills Feed

on:
  push:
    branches:
      - master
    paths:
      - '_publications/**'
      - '_portfolio/**'
      - '_experience/**'
      - 'scripts/generate_skills_feed.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install PyYAML

    - name: Generate skills-feed.json
      run: |
        python3 scripts/generate_skills_feed.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add assets/skills-feed.json
        git commit -m "Automated update of skills feed" || echo "No changes to commit"
        git push
