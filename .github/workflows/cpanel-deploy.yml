name: Deploy to cPanel

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Deploy to cPanel
        uses: rsync-deployments-action@v1
        with:
          switches: -avzr --delete
          path: _site/
          remote_path: /home/elmurjmz/public_html/
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Set permissions
        uses: fifsky/ssh-action@master
        with:
          command: chmod 755 /home/elmurjmz/public_html && find /home/elmurjmz/public_html -type f -exec chmod 644 {} + && find /home/elmurjmz/public_html -type d -exec chmod 755 {} +
          host: ${{ secrets.CPANEL_HOST }}
          user: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
